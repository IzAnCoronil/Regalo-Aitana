<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Melancolía</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        /* --- BARRA DE SCROLL PERSONALIZADA (ESTÉTICA PREMIUM) --- */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0f19; 
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(123, 44, 191, 0.35); /* Morado melancólico translúcido */
            border-radius: 10px;
            border: 2px solid #0b0f19;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(157, 78, 221, 0.6); 
        }

        html {
            scrollbar-width: thin;
            scrollbar-color: rgba(123, 44, 191, 0.35) #0b0f19;
            scroll-behavior: smooth;
        }

        /* --- ESTILOS DE LA ATMÓSFERA DE MELANCOLÍA --- */
        body {
            background: radial-gradient(circle at top, #1a2236, #0b0f19); /* Fondo profundo nocturno */
            color: #f3f4f6;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow-y: auto; 
        }

        /* NAV - Consistente y limpio */
        nav {
            background: rgba(11, 15, 25, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 14px 20px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 100;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            box-sizing: border-box;
        }

        nav::-webkit-scrollbar {
            display: none;
        }

        nav a {
            color: #9ca3af;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05em;
            transition: color 0.25s ease, transform 0.25s ease;
            display: inline-block;
            -webkit-tap-highlight-color: transparent;
        }

        nav a:hover {
            color: #ffffff;
            transform: scale(1.05);
        }

        header {
            text-align: center;
            padding: 140px 20px 10px;
        }

        header h1 {
            font-size: 3em;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(to right, #ffffff, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 12px 0;
        }

        header p {
            color: #9ca3af;
            font-size: 1.1em;
            font-weight: 300;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* CONTENEDOR EFECTO VIDRIO OPACO (GLASSMORPHISM) */
        .contenedor {
            background: rgba(17, 24, 39, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 50px 40px;
            margin: 40px auto 120px; 
            border-radius: 24px;
            max-width: 700px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
            text-align: center;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        /* Animación suave para la transición de frases */
        .frase-animada {
            animation: fadeInBlur 0.55s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInBlur {
            from { opacity: 0; filter: blur(5px); transform: translateY(6px); }
            to { opacity: 1; filter: blur(0); transform: translateY(0); }
        }

        .frase {
            font-size: 1.65em;
            color: #f9fafb;
            margin: 10px 0;
            font-weight: 400;
            line-height: 1.6;
            letter-spacing: -0.3px;
        }

        .autor {
            font-size: 1.05em;
            color: #9ca3af;
            margin: 0 0 35px 0;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        /* BOTÓN PRINCIPAL MORADO */
        .contenedor button {
            display: inline-block;
            padding: 14px 38px;
            background: linear-gradient(135deg, #7b2cbf, #5a189a);
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1.1em;
            letter-spacing: 0.2px;
            box-shadow: 0 4px 15px rgba(123, 44, 191, 0.25);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            -webkit-tap-highlight-color: transparent;
        }

        .contenedor button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(123, 44, 191, 0.45);
        }

        .contenedor button:disabled {
            background: #23232f;
            color: #4b5563;
            box-shadow: none;
            cursor: not-allowed;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .contenedor button:active:not(:disabled) {
            transform: translateY(1px);
        }

        /* BOTÓN FLOTANTE GUARDAR PREMIUM */
        button.boton-guardar {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 0;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 99;
            -webkit-tap-highlight-color: transparent;
        }

        button.boton-guardar:hover {
            background: #ffffff;
            color: #0b0f19;
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(123, 44, 191, 0.3);
        }
        
        /* Ajustes de adaptación móvil */
        @media (max-width: 768px) {
            nav {
                justify-content: flex-start;
                gap: 20px;
                padding: 14px 15px;
            }
            header {
                padding-top: 110px;
            }
            header h1 {
                font-size: 2.3em;
            }
            .contenedor {
                margin: 20px 15px 100px;
                padding: 40px 20px;
            }
            .frase {
                font-size: 1.35em;
            }
            .contenedor button {
                width: 100%;
                max-width: 320px;
            }
            button.boton-guardar {
                width: auto;
                bottom: 20px;
                right: 50%;
                transform: translateX(50%);
                padding: 10px 20px;
                font-size: 0.95em;
            }
            button.boton-guardar:hover {
                transform: translateX(50%) scale(1.02);
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="musica.html">Música</a>
        <a href="anadir.html">Añadir frases</a>
        <a href="sos.html">SOS</a>
        <a href="Love.html">Favoritos</a>
        <a href="album.html">Álbum</a>
        <a href="frasesamigos.html">Frases de amigos</a>
    </nav>

    <header>
        <h1>Melancolía</h1>
        <p>Frases que duelen suave, como un recuerdo que se queda a medias.</p>
    </header>

    <div class="contenedor" id="tarjetaContenedor">
        <div id="bloqueTexto">
            <p id="fraseMelancolia" class="frase">Iniciando tus recuerdos...</p>
            <p id="autorMelancolia" class="autor"></p>
        </div>

        <button id="btnSiguiente" onclick="nuevaFraseMelancolia()">Otra frase</button>
    </div>

    <button id="btnGuardar" class="boton-guardar" onclick="guardarFavorito('fraseMelancolia','autorMelancolia')">
        ❤️ Guardar
    </button>

    <script>
    const frasesMelancoliaOriginal = [
        { texto: "Hay días en los que el corazón recuerda cosas que la mente ya había olvidado.", autor: "Mario Benedetti" },
        { texto: "Hay silencios que pesan más que cualquier palabra rota.", autor: "Pablo Neruda" },
        { texto: "La melancolía es ese lugar donde se sientan los recuerdos a mirar el tiempo pasar.", autor: "Julio Cortázar" },
        { texto: "A veces el alma se queda mirando por la ventana de un recuerdo que ya no vuelve.", autor: "Rainer Maria Rilke" },
        { texto: "Hay noches en las que el pasado se sienta al borde de la cama.", autor: "Alejandra Pizarnik" },
        { texto: "La tristeza suave es solo amor que no encontró dónde quedarse.", autor: "Sabines" },
        { texto: "Algunas canciones duelen porque recuerdan cosas que nunca llegaron a pasar.", autor: "IzAn" },
        { texto: "Hay abrazos que se quedaron a medio camino entre el deseo y el miedo.", autor: "Mario Benedetti" },
        { texto: "La melancolía no es querer volver, es no saber cómo seguir.", autor: "Pablo Neruda" },
        { texto: "Hay fotos que ya no existen, pero siguen colgadas en la memoria.", autor: "Julio Cortázar" },
        { texto: "A veces el corazón se sienta en el suelo y mira cómo se va el día.", autor: "Rainer Maria Rilke" },
        { texto: "La nostalgia es un idioma que solo entienden los que han perdido algo que amaban.", autor: "Alejandra Pizarnik" },
        { texto: "Hay lugares que ya no se pisan, pero que siguen caminando dentro de uno.", autor: "Sabines" },
        { texto: "La melancolía es un hilo que une lo que fue con lo que nunca será.", autor: "IzAn" },
        { texto: "Hay tardes que se quedan atrapadas en una luz que ya no existe.", autor: "Mario Benedetti" },
        { texto: "El tiempo no borra, solo difumina los bordes del recuerdo.", autor: "Pablo Neruda" },
        { texto: "Hay nombres que ya no se dicen, pero que aún se escapan en los pensamientos.", autor: "Julio Cortázar" },
        { texto: "La melancolía es el eco de todo lo que no supo cómo despedirse.", autor: "Rainer Maria Rilke" },
        { texto: "Hay días en los que el corazón solo quiere sentarse a mirar lo que ya no es.", autor: "Alejandra Pizarnik" },
        { texto: "La tristeza suave es una forma de recordar sin hacer ruido.", autor: "Sabines" }
    ];

    // Variables globales de entorno y estado
    let todasLasFrases = [];
    let frasesMelancolia = [];
    let ultimoAutorMelancolia = null;
    let fraseActualMostrada = null; 

    /**
     * Sincroniza las colecciones locales y aplica exclusión por descarte permanente
     */
    function inicializarDatos() {
        let frasesUsuarioRaw = JSON.parse(localStorage.getItem("melancolia")) || [];
        let frasesUsuarioLimpias = frasesUsuarioRaw.filter(item => 
            item && typeof item === 'object' && item.texto && item.autor
        );

        todasLasFrases = [...frasesMelancoliaOriginal, ...frasesUsuarioLimpias];

        // Lectura del historial permanente de exclusión
        let vistas = JSON.parse(localStorage.getItem("melancolia_vistas")) || [];

        // Filtro estricto para eliminar las frases ya consumidas definitivamente
        frasesMelancolia = todasLasFrases.filter(frase => 
            !vistas.some(v => v.texto.trim() === frase.texto.trim() && v.autor.trim() === frase.autor.trim())
        );
    }

    /**
     * Lanza la animación controlando el reflow del DOM mediante lectura de propiedades
     */
    function aplicarAnimacion() {
        const elemento = document.getElementById("bloqueTexto");
        if (!elemento) return;
        
        elemento.classList.remove("frase-animada");
        void elemento.offsetWidth; 
        elemento.classList.add("frase-animada");
    }

    /**
     * Transfiere una frase de manera irreversible al almacén definitivo de descartes
     */
    function registrarFraseVista(frase) {
        if (!frase) return;
        let vistas = JSON.parse(localStorage.getItem("melancolia_vistas")) || [];
        if (!vistas.some(v => v.texto === frase.texto && v.autor === frase.autor)) {
            vistas.push(frase);
            localStorage.setItem("melancolia_vistas", JSON.stringify(vistas));
        }
    }

    /**
     * Maneja de manera segura las actualizaciones de renderizado en el árbol DOM
     */
    function pintarEnPantalla(texto, autor, esMensajeFinal = false) {
        const txtEl = document.getElementById("fraseMelancolia");
        const autEl = document.getElementById("autorMelancolia");
        const btnNext = document.getElementById("btnSiguiente");
        const btnSave = document.getElementById("btnGuardar");

        if (txtEl) txtEl.textContent = texto;
        if (autEl) autEl.textContent = esMensajeFinal ? "" : "— " + autor;

        if (esMensajeFinal) {
            if (btnNext) {
                btnNext.disabled = true;
                btnNext.textContent = "Fin del trayecto";
            }
            if (btnSave) btnSave.style.display = "none";
        } else {
            if (btnSave) btnSave.style.display = "flex";
        }
        aplicarAnimacion();
    }

    /**
     * Carga y asegura el renderizado de la primera frase sin alterar la pila ante recargas
     */
    function mostrarPrimeraFraseMelancolia() {
        inicializarDatos();

        if (frasesMelancolia.length === 0) {
            mostrarMensajeFinal();
            return;
        }

        // Muestra la primera entrada disponible respetando los re-frescos de F5
        let seleccionada = frasesMelancolia[0];

        fraseActualMostrada = seleccionada; // Resguardado en el limbo temporal
        ultimoAutorMelancolia = seleccionada.autor;
        pintarEnPantalla(seleccionada.texto, seleccionada.autor);
    }

    /**
     * Elimina permanentemente la frase anterior y selecciona un nuevo nodo aleatorio sin repetición de autor directo
     */
    function nuevaFraseMelancolia() {
        // Al pulsar el botón, quemamos de forma definitiva en localStorage la frase que estaba visible
        if (fraseActualMostrada) {
            registrarFraseVista(fraseActualMostrada);
        }

        // Re-sincronizar arrays para trabajar sobre la lista limpia actualizada
        inicializarDatos();

        if (frasesMelancolia.length === 0) {
            mostrarMensajeFinal();
            return;
        }

        let elegidoIdx = -1;
        let intentos = 0;
        const maxIntentos = 15;

        while (intentos < maxIntentos) {
            let randomIdx = Math.floor(Math.random() * frasesMelancolia.length);
            let candidata = frasesMelancolia[randomIdx];

            if (candidata.autor !== ultimoAutorMelancolia || frasesMelancolia.length === 1) {
                elegidoIdx = randomIdx;
                break;
            }
            intentos++;
        }

        if (elegidoIdx === -1) elegidoIdx = 0;

        const fraseFinal = frasesMelancolia[elegidoIdx];
        fraseActualMostrada = fraseFinal; // Asignación de la nueva frase en ventana al limbo
        ultimoAutorMelancolia = fraseFinal.autor;

        pintarEnPantalla(fraseFinal.texto, fraseFinal.autor);

        // Desplazamiento sutil con scroll inteligente adaptado
        const contenedor = document.getElementById("tarjetaContenedor");
        if (contenedor) {
            const yOffset = -100; 
            const yPosition = contenedor.getBoundingClientRect().top + window.pageYOffset + yOffset;
            window.scrollTo({ top: yPosition, behavior: "smooth" });
        }
    }

    /**
     * Renderiza el estado terminal cuando no quedan frases libres
     */
    function mostrarMensajeFinal() {
        fraseActualMostrada = null;
        pintarEnPantalla("Hoy ya no hay más frases, pero tu melancolía sigue escribiendo las suyas en silencio. ❤️", "", true);
    }

    /**
     * Agrega elementos a la colección cruzada de Favoritos de la app general
     */
    function guardarFavorito(idFrase, idAutor) {
        const txtEl = document.getElementById(idFrase);
        const autEl = document.getElementById(idAutor);
        
        if (!txtEl || !autEl) return;

        const frase = txtEl.textContent.trim();
        let autor = autEl.textContent.trim().replace(/^—\s*/, "");

        if (!frase || frase.startsWith("Hoy ya no hay más frases") || frase.startsWith("Iniciando tus recuerdos")) return;

        let favoritos = JSON.parse(localStorage.getItem("favoritos")) || [];
        const yaExiste = favoritos.some(f => f.frase.trim() === frase);
        
        if (!yaExiste) {
            favoritos.push({ frase: frase, autor: autor });
            localStorage.setItem("favoritos", JSON.stringify(favoritos));
            alert("¡Frase guardada en tus favoritos! ❤️");
        } else {
            alert("Esta frase ya está en tus favoritos.");
        }
    }

    // Inicialización al vuelo del ciclo de vida
    document.addEventListener("DOMContentLoaded", function() {
        mostrarPrimeraFraseMelancolia();
        window.scrollTo({ top: 0 });
    });
    </script>

</body>
</html>
