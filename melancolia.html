<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Melancolía</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        /* --- BARRA DE SCROLL PERSONALIZADA (ESTÉTICA PREMIUM) --- */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0f19; 
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(123, 44, 191, 0.35); /* Morado melancólico translúcido */
            border-radius: 10px;
            border: 2px solid #0b0f19;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(157, 78, 221, 0.6); 
        }

        html {
            scrollbar-width: thin;
            scrollbar-color: rgba(123, 44, 191, 0.35) #0b0f19;
            scroll-behavior: smooth;
        }

        /* --- ESTILOS DE LA ATMÓSFERA DE MELANCOLÍA --- */
        body {
            background: radial-gradient(circle at top, #1a2236, #0b0f19); /* Fondo profundo nocturno */
            color: #f3f4f6;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow-y: auto; 
        }

        /* NAV - Consistente y limpio */
        nav {
            background: rgba(11, 15, 25, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 14px 20px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 100;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            box-sizing: border-box;
        }

        nav::-webkit-scrollbar {
            display: none;
        }

        nav a {
            color: #9ca3af;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05em;
            transition: color 0.25s ease, transform 0.25s ease;
            display: inline-block;
            -webkit-tap-highlight-color: transparent;
        }

        nav a:hover {
            color: #ffffff;
            transform: scale(1.05);
        }

        header {
            text-align: center;
            padding: 140px 20px 10px;
        }

        header h1 {
            font-size: 3em;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(to right, #ffffff, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 12px 0;
        }

        header p {
            color: #9ca3af;
            font-size: 1.1em;
            font-weight: 300;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* CONTENEDOR EFECTO VIDRIO OPACO (GLASSMORPHISM) */
        .contenedor {
            background: rgba(17, 24, 39, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 50px 40px;
            margin: 40px auto 120px; 
            border-radius: 24px;
            max-width: 700px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
            text-align: center;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        /* Animación suave para la transición de frases */
        .frase-animada {
            animation: fadeInBlur 0.55s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInBlur {
            from { opacity: 0; filter: blur(5px); transform: translateY(6px); }
            to { opacity: 1; filter: blur(0); transform: translateY(0); }
        }

        .frase {
            font-size: 1.65em;
            color: #f9fafb;
            margin: 10px 0;
            font-weight: 400;
            line-height: 1.6;
            letter-spacing: -0.3px;
        }

        .autor {
            font-size: 1.05em;
            color: #9ca3af;
            margin: 0 0 35px 0;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        /* BOTÓN PRINCIPAL MORADO */
        .contenedor button {
            display: inline-block;
            padding: 14px 38px;
            background: linear-gradient(135deg, #7b2cbf, #5a189a);
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1.1em;
            letter-spacing: 0.2px;
            box-shadow: 0 4px 15px rgba(123, 44, 191, 0.25);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            -webkit-tap-highlight-color: transparent;
        }

        .contenedor button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(123, 44, 191, 0.45);
        }

        .contenedor button:active {
            transform: translateY(1px);
        }

        /* BOTÓN FLOTANTE GUARDAR PREMIUM */
        button.boton-guardar {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 0;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 99;
            -webkit-tap-highlight-color: transparent;
        }

        button.boton-guardar:hover {
            background: #ffffff;
            color: #0b0f19;
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(123, 44, 191, 0.3);
        }
        
        /* Ajustes de adaptación móvil */
        @media (max-width: 768px) {
            nav {
                justify-content: flex-start;
                gap: 20px;
                padding: 14px 15px;
            }
            header {
                padding-top: 110px;
            }
            header h1 {
                font-size: 2.3em;
            }
            .contenedor {
                margin: 20px 15px 100px;
                padding: 40px 20px;
            }
            .frase {
                font-size: 1.35em;
            }
            .contenedor button {
                width: 100%;
                max-width: 320px;
            }
            button.boton-guardar {
                width: auto;
                bottom: 20px;
                right: 20px;
                padding: 10px 20px;
                font-size: 0.95em;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="musica.html">Música</a>
        <a href="anadir.html">Añadir frases</a>
        <a href="sos.html">SOS</a>
        <a href="Love.html">Favoritos</a>
        <a href="album.html">Álbum</a>
        <a href="frasesamigos.html">Frases de amigos</a>
    </nav>

    <header>
        <h1>Melancolía</h1>
        <p>Frases que duelen suave, como un recuerdo que se queda a medias.</p>
    </header>

    <div class="contenedor">
        <div id="bloqueTexto">
            <p id="fraseMelancolia" class="frase"></p>
            <p id="autorMelancolia" class="autor"></p>
        </div>

        <button onclick="nuevaFraseMelancolia()">Otra frase</button>
    </div>

    <button class="boton-guardar" onclick="guardarFavorito('fraseMelancolia','autorMelancolia')">
        ❤️ Guardar
    </button>

    <script>
    const frasesMelancoliaOriginal = [
        { texto: "Hay días en los que el corazón recuerda cosas que la mente ya había olvidado.", autor: "Mario Benedetti" },
        { texto: "Hay silencios que pesan más que cualquier palabra rota.", autor: "Pablo Neruda" },
        { texto: "La melancolía es ese lugar donde se sientan los recuerdos a mirar el tiempo pasar.", autor: "Julio Cortázar" },
        { texto: "A veces el alma se queda mirando por la ventana de un recuerdo que ya no vuelve.", autor: "Rainer Maria Rilke" },
        { texto: "Hay noches en las que el pasado se sienta al borde de la cama.", autor: "Alejandra Pizarnik" },
        { texto: "La tristeza suave es solo amor que no encontró dónde quedarse.", autor: "Sabines" },
        { texto: "Algunas canciones duelen porque recuerdan cosas que nunca llegaron a pasar.", autor: "IzAn" },
        { texto: "Hay abrazos que se quedaron a medio camino entre el deseo y el miedo.", autor: "Mario Benedetti" },
        { texto: "La melancolía no es querer volver, es no saber cómo seguir.", autor: "Pablo Neruda" },
        { texto: "Hay fotos que ya no existen, pero siguen colgadas en la memoria.", autor: "Julio Cortázar" },
        { texto: "A veces el corazón se sienta en el suelo y mira cómo se va el día.", autor: "Rainer Maria Rilke" },
        { texto: "La nostalgia es un idioma que solo entienden los que han perdido algo que amaban.", autor: "Alejandra Pizarnik" },
        { texto: "Hay lugares que ya no se pisan, pero que siguen caminando dentro de uno.", autor: "Sabines" },
        { texto: "La melancolía es un hilo que une lo que fue con lo que nunca será.", autor: "IzAn" },
        { texto: "Hay tardes que se quedan atrapadas en una luz que ya no existe.", autor: "Mario Benedetti" },
        { texto: "El tiempo no borra, solo difumina los bordes del recuerdo.", autor: "Pablo Neruda" },
        { texto: "Hay names que ya no se dicen, pero que aún se escapan en los pensamientos.", autor: "Julio Cortázar" },
        { texto: "La melancolía es el eco de todo lo que no supo cómo despedirse.", autor: "Rainer Maria Rilke" },
        { texto: "Hay días en los que el corazón solo quiere sentarse a mirar lo que ya no es.", autor: "Alejandra Pizarnik" },
        { texto: "La tristeza suave es una forma de recordar sin hacer ruido.", autor: "Sabines" }
    ];

    let frasesUsuario = JSON.parse(localStorage.getItem("melancolia")) || [];
    frasesUsuario = frasesUsuario.filter(f => f && f.texto && f.autor);
    let frasesMelancolia = frasesMelancoliaOriginal.concat(frasesUsuario);

    let ultimoAutorMelancolia = null;
    let primeraMostrada = false;

    function aplicarAnimacion() {
        const elemento = document.getElementById("bloqueTexto");
        elemento.classList.remove("frase-animada");
        void elemento.offsetWidth; 
        elemento.classList.add("frase-animada");
    }

    function mostrarPrimeraFraseMelancolia() {
        if (frasesMelancolia.length === 0) {
            document.getElementById("fraseMelancolia").textContent = "Añade frases para comenzar.";
            document.getElementById("autorMelancolia").textContent = "";
            return;
        }
        
        const primera = frasesMelancolia[0];
        document.getElementById("fraseMelancolia").textContent = primera.texto;
        document.getElementById("autorMelancolia").textContent = "— " + primera.autor;
        
        ultimoAutorMelancolia = primera.autor;
        frasesMelancolia.splice(0, 1);
        primeraMostrada = true;
        aplicarAnimacion();
    }

    function nuevaFraseMelancolia() {
        if (!primeraMostrada) {
            mostrarPrimeraFraseMelancolia();
            return;
        }

        if (frasesMelancolia.length === 0) {
            document.getElementById("fraseMelancolia").textContent =
                "Hoy ya no hay más frases, pero tu melancolía sigue escribiendo las suyas en silencio.";
            document.getElementById("autorMelancolia").textContent = "";
            aplicarAnimacion();
            return;
        }

        let indice;
        let intentos = 0;

        do {
            indice = Math.floor(Math.random() * frasesMelancolia.length);
            intentos++; 
        } while (frasesMelancolia[indice].autor === ultimoAutorMelancolia && intentos < 10 && frasesMelancolia.length > 1);

        const frase = frasesMelancolia[indice];

        document.getElementById("fraseMelancolia").textContent = frase.texto;
        document.getElementById("autorMelancolia").textContent = "— " + frase.autor;

        ultimoAutorMelancolia = frase.autor;
        frasesMelancolia.splice(indice, 1);
        aplicarAnimacion();
    }

    function guardarFavorito(idFrase, idAutor) {
        const frase = document.getElementById(idFrase).textContent;
        let autor = document.getElementById(idAutor).textContent;

        if (!frase || frase.includes("Hoy ya no hay más frases") || frase === "Añade frases para comenzar.") {
            return;
        }

        autor = autor.replace("— ", "");

        let favoritos = JSON.parse(localStorage.getItem("favoritos")) || [];
        const yaExiste = favoritos.some(f => f.frase === frase);

        if (!yaExiste) {
            favoritos.push({ frase, autor });
            localStorage.setItem("favoritos", JSON.stringify(favoritos));
            alert("¡Frase guardada en tus favoritos! ❤️");
        } else {
            alert("Esta frase ya está en tus favoritos.");
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        mostrarPrimeraFraseMelancolia();
    });
    </script>

</body>
</html>
