            font-size: 1.2em;

        }

        if (frasesAnsiedad.length === 0) {
            document.getElementById("fraseAnsiedad").textContent = "Añade frases para comenzar.";

        }

        const primera = frasesAnsiedad[indiceInicial];
        document.getElementById("fraseAnsiedad").textContent = primera.texto;
        document.getElementById("autorAnsiedad").textContent = "— " + primera.autor;
        
        ultimaAutora = primera.autor;
        frasesAnsiedad.splice(indiceInicial, 1);
        primeraMostrada = true;
    }

            indice = Math.floor(Math.random() * frasesAnsiedad.length);
            intentos++; // <- CORREGIDO AQUÍ (Antes decía intentas++)
        } while (frasesAnsiedad[indice].autor === ultimaAutora && intentos < 10 && frasesAnsiedad.length > 1);

        const frase = frasesAnsiedad[indice];

        document.getElementById("fraseAnsiedad").textContent = frase.texto;
        document.getElementById("autorAnsiedad").textContent = "— " + frase.autor;

        ultimaAutora = frase.autor;
        frasesAnsiedad.splice(indice, 1);
    }

    function guardarFavorito(idFrase, idAutor) {
        const frase = document.getElementById(idFrase).textContent;
        let autor = document.getElementById(idAutor).textContent;

        if (!frase || frase.includes("Hoy ya no hay más frases") || frase === "Añade frases para comenzar.") {
            return;
        }

        autor = autor.replace("— ", "");

        let favoritos = JSON.parse(localStorage.getItem("favoritos")) || [];
        const yaExiste = favoritos.some(f => f.frase === frase);

        if (!yaExiste) {
            favoritos.push({ frase, autor });
            localStorage.setItem("favoritos", JSON.stringify(favoritos));
            alert("¡Frase guardada en tus favoritos! ❤️");
        } else {
            alert("Esta frase ya está en tus favoritos.");
        }
    }

    window.onload = function() {
        mostrarPrimeraFrase();
    };
    </script>
