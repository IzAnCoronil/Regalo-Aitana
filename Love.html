<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Frases Favoritas ❤️</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* Optimización global del Scroll */
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #fff0f5, #ffffff);
            color: #4a4a4a;
            min-height: 100vh;
            /* Forzar comportamiento nativo y limpio de scroll en móviles */
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        /* NAV - Estructura unificada */
        nav {
            background: #ffe08a;
            padding: 12px 20px;
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 35px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 100;
            box-sizing: border-box;
        }

        nav a {
            color: #5a3e00;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05em;
            transition: 0.2s;
        }

        nav a:hover {
            color: #8a6500;
            transform: scale(1.08);
        }

        /* HEADER */
        header {
            text-align: center;
            padding: 130px 20px 20px;
            color: #7d2d40;
        }

        header h1 {
            font-size: 2.6em;
            margin-bottom: 10px;
        }

        header p {
            color: #a04e60;
            font-size: 1.1em;
            margin-top: 0;
        }

        /* CONTENEDOR PRINCIPAL */
        .lista {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            /* Espacio de seguridad extra para que las tarjetas no queden ocultas tras el botón */
            padding-bottom: 120px; 
            box-sizing: border-box;
        }

        .item {
            background: white;
            padding: 30px;
            margin-bottom: 25px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            border-left: 5px solid #ff6f91;
            transition: 0.2s;
            position: relative;
        }

        .item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 111, 145, 0.12);
        }

        .frase {
            font-size: 1.3em;
            font-weight: 400;
            line-height: 1.5;
            color: #333;
            margin: 0 0 12px 0;
        }

        .autor {
            font-size: 0.95em;
            color: #8a8a8a;
            margin: 0 0 20px 0;
            font-style: italic;
        }

        /* BOTONES */
        .borrar {
            background: #fff0f2;
            color: #ff4f7a;
            border: 1px solid #ffccd5;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            transition: 0.2s;
        }

        .borrar:hover {
            background: #ff4f7a;
            color: white;
            border-color: #ff4f7a;
            transform: scale(1.03);
        }

        .borrarTodo {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #ff4f7a;
            color: white;
            padding: 14px 22px;
            border-radius: 14px;
            font-size: 1.05em;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 79, 122, 0.3);
            transition: 0.2s;
            z-index: 90;
        }

        .borrarTodo:hover {
            background: #e0355f;
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(255, 79, 122, 0.4);
        }

        .vacio {
            text-align: center;
            margin-top: 40px;
            font-size: 1.25em;
            color: #a04e60;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* Optimización responsiva para pantallas pequeñas */
        @media (max-width: 600px) {
            nav {
                gap: 15px;
                padding: 10px;
            }
            nav a {
                font-size: 0.9em;
            }
            header {
                padding-top: 160px;
            }
            .borrarTodo {
                bottom: 15px;
                right: 15px;
                padding: 10px 16px;
                font-size: 0.95em;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="musica.html">Música</a>
        <a href="anadir.html">Añadir frases</a>
        <a href="sos.html">SOS</a>
        <a href="love.html">Favoritos</a>
        <a href="album.html">Álbum</a>
        <a href="frasesamigos.html">Frases de amigos</a>
    </nav>

    <header>
        <h1>Love ❤️</h1>
        <p>Tus frases guardadas con cariño</p>
    </header>

    <div class="lista" id="listaFavoritos"></div>

    <div class="borrarTodo" onclick="borrarTodos()">🗑️ Borrar todo</div>

    <script>
        function cargarFavoritos() {
            const contenedor = document.getElementById("listaFavoritos");
            contenedor.innerHTML = "";

            let favoritos = JSON.parse(localStorage.getItem("favoritos")) || [];

            if (favoritos.length === 0) {
                contenedor.innerHTML = '<p class="vacio">Aún no has guardado ninguna frase con amor ❤️</p>';
                document.querySelector(".borrarTodo").style.display = "none";
                return;
            } else {
                document.querySelector(".borrarTodo").style.display = "block";
            }

            favoritos.forEach((item, index) => {
                if (item && item.frase && item.autor) {
                    const div = document.createElement("div");
                    div.className = "item";

                    let fraseLimpia = item.frase.trim();
                    if (fraseLimpia.startsWith("“") && fraseLimpia.endsWith("”")) {
                        fraseLimpia = fraseLimpia.substring(1, fraseLimpia.length - 1);
                    }

                    div.innerHTML = `
                        <p class="frase">“${fraseLimpia}”</p>
                        <p class="autor">— ${item.autor.replace("— ", "")}</p>
                        <button class="borrar" onclick="borrarUno(${index})">Eliminar de favoritos</button>
                    `;

                    contenedor.appendChild(div);
                }
            });
        }

        function borrarUno(indice) {
            let favoritos = JSON.parse(localStorage.getItem("favoritos")) || [];
            favoritos.splice(indice, 1);
            localStorage.setItem("favoritos", JSON.stringify(favoritos));
            cargarFavoritos();
        }

        function borrarTodos() {
            if (confirm("¿Estás seguro de que deseas eliminar todas tus frases favoritas?")) {
                localStorage.removeItem("favoritos");
                cargarFavoritos();
            }
        }

        window.onload = cargarFavoritos;
    </script>

</body>
</html>
