<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Frases Favoritas ❤️</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* Optimización global del Scroll */
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #fff0f5, #ffffff);
            color: #4a4a4a;
            min-height: 100vh;
            /* Forzar comportamiento nativo y limpio de scroll en móviles */
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        /* NAV - Estructura fluida y adaptada a móviles */
        nav {
            background: #ffe08a;
            padding: 12px 20px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 35px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 100;
            box-sizing: border-box;
        }

        nav a {
            color: #5a3e00;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05em;
            transition: 0.2s;
            white-space: nowrap; /* Evita que el texto se rompa en dos líneas */
        }

        nav a:hover {
            color: #8a6500;
            transform: scale(1.08);
        }

        /* HEADER */
        header {
            text-align: center;
            padding: 130px 20px 20px;
            color: #7d2d40;
        }

        header h1 {
            font-size: 2.6em;
            margin-bottom: 10px;
        }

        header p {
            color: #a04e60;
            font-size: 1.1em;
            margin-top: 0;
        }

        /* CONTENEDOR PRINCIPAL Y CARRUSEL */
        .lista {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            /* Espacio de seguridad extra para que las tarjetas no queden ocultas tras el botón */
            padding-bottom: 120px; 
            box-sizing: border-box;
        }

        .item {
            background: white;
            padding: 30px;
            margin-bottom: 25px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            border-left: 5px solid #ff6f91;
            transition: 0.2s;
            position: relative;
        }

        .item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 111, 145, 0.12);
        }

        .frase {
            font-size: 1.3em;
            font-weight: 400;
            line-height: 1.5;
            color: #333;
            margin: 0 0 12px 0;
        }

        .autor {
            font-size: 0.95em;
            color: #8a8a8a;
            margin: 0 0 20px 0;
            font-style: italic;
        }

        /* Animación para el cambio de frases del carrusel */
        .frase-animada {
            animation: fadeInUp 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* BOTONES */
        .borrar, .siguiente-btn {
            background: #fff0f2;
            color: #ff4f7a;
            border: 1px solid #ffccd5;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            transition: 0.2s;
        }

        .borrar:hover, .siguiente-btn:hover {
            background: #ff4f7a;
            color: white;
            border-color: #ff4f7a;
            transform: scale(1.03);
        }

        .seccion-carrusel {
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            margin-bottom: 40px;
            border-top: 5px solid #ffe08a;
        }

        .seccion-titulo {
            font-size: 1.4em;
            color: #7d2d40;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .borrarTodo {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #ff4f7a;
            color: white;
            padding: 14px 22px;
            border-radius: 14px;
            font-size: 1.05em;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 79, 122, 0.3);
            transition: 0.2s;
            z-index: 90;
        }

        .borrarTodo:hover {
            background: #e0355f;
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(255, 79, 122, 0.4);
        }

        .vacio {
            text-align: center;
            margin-top: 20px;
            font-size: 1.25em;
            color: #a04e60;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* Optimización responsiva para pantallas pequeñas (Móviles) */
        @media (max-width: 768px) {
            nav {
                justify-content: flex-start;
                gap: 20px;
                overflow-x: auto; /* Scroll horizontal si los enlaces no caben */
                padding: 15px 10px;
                -webkit-overflow-scrolling: touch;
            }
            
            nav a {
                font-size: 1em;
            }

            header {
                padding-top: 100px;
            }

            header h1 {
                font-size: 2.1em;
            }

            .lista {
                padding: 10px 15px 140px;
            }

            .item, .seccion-carrusel {
                padding: 20px 15px;
                margin-bottom: 20px;
            }

            .frase {
                font-size: 1.15em;
            }

            .borrarTodo {
                bottom: 20px;
                right: 50%;
                transform: translateX(50%); /* Centra el botón flotante en pantallas pequeñas */
                width: 85%;
                text-align: center;
                box-sizing: border-box;
            }

            .borrarTodo:hover {
                transform: translateX(50%) scale(1.02); /* Evita romper el centrado al pasar el dedo */
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="musica.html">Música</a>
        <a href="anadir.html">Añadir frases</a>
        <a href="sos.html">SOS</a>
        <a href="love.html">Favoritos</a>
        <a href="album.html">Álbum</a>
        <a href="frasesamigos.html">Frases de amigos</a>
    </nav>

    <header>
        <h1>Love ❤️</h1>
        <p>Tus frases guardadas con cariño</p>
    </header>

    <div class="lista">
        <div class="seccion-carrusel">
            <h2 class="seccion-titulo">Bienestar Emocional ✨</h2>
            <div id="contenedorTextoCarrusel">
                <p class="frase" id="carruselTexto">Cargando tu espacio seguro...</p>
                <p class="autor" id="carruselAutor"></p>
            </div>
            <button class="siguiente-btn" id="btnSiguienteFrase" onclick="nuevaFraseAnsiedad()">Nueva frase de apoyo</button>
        </div>

        <h2 class="seccion-titulo">Mis Frases Guardadas</h2>
        <div id="listaFavoritos"></div>
    </div>

    <div class="borrarTodo" id="botonBorrarTodo" onclick="borrarTodos()">🗑️ Borrar todo</div>

    <script>
        // ==========================================
        // LÓGICA 1: GESTIÓN DEL CARRUSEL INTELIGENTE
        // ==========================================
        
        // Base de datos estática original
        const frasesAnsiedadOriginal = [
            { texto: "Mi niña, has podido superar momentos difíciles antes y este también pasará.", autor: "IzAn" },
            { texto: "No tienes que controlar tus pensamientos. Solo tienes que dejar de permitir que ellos te controlen a ti.", autor: "Dan Millman" },
            { texto: "Esta tormenta en tu mente eventualmente se quedará sin lluvia.", autor: "Anónimo" },
            { texto: "Respirar profundamente es el acto de recordar que estás a salvo aquí y ahora.", autor: "IzAn" },
            { texto: "Tu ansiedad no define tu fuerza, la forma en la que la afrontas sí.", autor: "Anónimo" },
            { texto: "No estás perdiendo el control, simplemente estás procesando algo difícil. Date tiempo.", autor: "Psic. Bienestar" }
        ];

        let todasLasFrases = [];   // Pool global unificado
        let frasesAnsiedad = [];    // Pool activo en memoria para la sesión
        let ultimoAutor = null;     // Rastreador anti-repetición consecutiva

        /**
         * Inicializa, limpia y filtra los datos aplicando el descarte estricto histórico
         */
        function inicializarDatosCarrusel() {
            // Recuperar y filtrar el array dinámico de frases del usuario
            let frasesUsuarioRaw = JSON.parse(localStorage.getItem("ansiedad")) || [];
            let frasesUsuarioLimpias = frasesUsuarioRaw.filter(item => 
                item && typeof item === 'object' && item.texto && item.autor
            );

            // Fusionar arrays
            todasLasFrases = [...frasesAnsiedadOriginal, ...frasesUsuarioLimpias];

            // Recuperar historial de vistas
            let vistas = JSON.parse(localStorage.getItem("ansiedad_vistas")) || [];

            // Filtrar de forma estricta: excluir todo lo que ya esté en "ansiedad_vistas"
            frasesAnsiedad = todasLasFrases.filter(frase => 
                !vistas.some(v => v.texto === frase.texto && v.autor === frase.autor)
            );
        }

        /**
         * Fuerza el reflujo del DOM para reiniciar limpiamente la animación de CSS
         */
        function aplicarAnimacion() {
            const elemento = document.getElementById("contenedorTextoCarrusel");
            if (!elemento) return;
            elemento.classList.remove("frase-animada");
            void elemento.offsetWidth; // Forzado de reflujo (reflow)
            elemento.classList.add("frase-animada");
        }

        /**
         * Guarda de inmediato en el historial de vistas y elimina del pool actual
         */
        function registrarFraseComoVista(frase) {
            let vistas = JSON.parse(localStorage.getItem("ansiedad_vistas")) || [];
            if (!vistas.some(v => v.texto === frase.texto && v.autor === frase.autor)) {
                vistas.push(frase);
                localStorage.setItem("ansiedad_vistas", JSON.stringify(vistas));
            }
            // Eliminar de la sesión activa
            frasesAnsiedad = frasesAnsiedad.filter(f => f.texto !== frase.texto || f.autor !== frase.autor);
        }

        /**
         * Renderiza el contenido del carrusel en pantalla de manera limpia
         */
        function renderizarCarrusel(texto, autor, esMensajeFinal = false) {
            const txtEl = document.getElementById("carruselTexto");
            const autEl = document.getElementById("carruselAutor");
            const btnNext = document.getElementById("btnSiguienteFrase");

            if (txtEl) txtEl.innerText = texto;
            if (autEl) autEl.innerText = esMensajeFinal ? "" : `— ${autor}`;
            
            if (esMensajeFinal && btnNext) {
                btnNext.disabled = true;
                btnNext.style.opacity = "0.5";
            }
            aplicarAnimacion();
        }

        /**
         * Busca la frase inicial fija o muestra la primera que se encuentre libre
         */
        function mostrarPrimeraFrase() {
            inicializarDatosCarrusel();

            if (frasesAnsiedad.length === 0) {
                mostrarMensajeFinalCarrusel();
                return;
            }

            // Criterio específico: Autor "IzAn" y frase que empiece con "Mi niña, has podido superar"
            const indiceFijo = frasesAnsiedad.findIndex(f => 
                f.autor === "IzAn" && f.texto.startsWith("Mi niña, has podido superar")
            );

            let seleccionada;
            if (indiceFijo !== -1) {
                seleccionada = frasesAnsiedad[indiceFijo];
            } else {
                seleccionada = frasesAnsiedad[0];
            }

            ultimoAutor = seleccionada.autor;
            registrarFraseComoVista(seleccionada);
            renderizarCarrusel(seleccionada.texto, seleccionada.autor);
        }

        /**
         * Cambia de frase aleatoriamente evitando autores consecutivos de forma inteligente
         */
        function nuevaFraseAnsiedad() {
            if (frasesAnsiedad.length === 0) {
                mostrarMensajeFinalCarrusel();
                return;
            }

            let indiceElegido = -1;
            let intentos = 0;
            const maxIntentos = 15;

            while (intentos < maxIntentos) {
                let randomIdx = Math.floor(Math.random() * frasesAnsiedad.length);
                let candidata = frasesAnsiedad[randomIdx];

                if (candidata.autor !== ultimoAutor || frasesAnsiedad.length === 1) {
                    indiceElegido = randomIdx;
                    break;
                }
                intentos++;
            }

            // Fallback por si quedan pocas opciones y se agotan los intentos seguros
            if (indiceElegido === -1) indiceElegido = 0;

            const fraseFinal = frasesAnsiedad[indiceElegido];
            ultimoAutor = fraseFinal.autor;

            registrarFraseComoVista(fraseFinal);
            renderizarCarrusel(fraseFinal.texto, fraseFinal.autor);
        }

        function mostrarMensajeFinalCarrusel() {
            renderizarCarrusel("Has completado todas las frases disponibles de esta sección. ¡Eres muy fuerte! ❤️", "", true);
        }


        // ==========================================
        // LÓGICA 2: INTERFAZ DE FRASES FAVORITAS
        // ==========================================

        /**
         * Pinta dinámicamente las tarjetas de favoritos limpiando strings y formateando
         */
        function cargarFavoritos() {
            const contenedor = document.getElementById("listaFavoritos");
            const btnBorrarTodo = document.getElementById("botonBorrarTodo");
            if (!contenedor) return;
            
            contenedor.innerHTML = "";
            let favoritos = JSON.parse(localStorage.getItem("favoritos")) || [];

            if (favoritos.length === 0) {
                contenedor.innerHTML = '<p class="vacio">Aún no has guardado ninguna frase con amor ❤️</p>';
                if (btnBorrarTodo) btnBorrarTodo.style.display = "none";
                return;
            } else {
                if (btnBorrarTodo) btnBorrarTodo.style.display = "block";
            }

            favoritos.forEach((item, index) => {
                if (item && item.frase && item.autor) {
                    const div = document.createElement("div");
                    div.className = "item";

                    // Limpieza rigurosa de dobles comillas tipográficas duplicadas al inicio y final
                    let fraseLimpia = item.frase.trim();
                    fraseLimpia = fraseLimpia.replace(/^[“""'‘]|[”""'’]$/g, "");

                    // Formateo del autor eliminando guiones duplicados previos
                    let autorLimpio = item.autor.trim().replace(/^[—\-_]\s*/, "");

                    div.innerHTML = `
                        <p class="frase">“${fraseLimpia}”</p>
                        <p class="autor">— ${autorLimpio}</p>
                        <button class="borrar" onclick="borrarUno(${index})">Eliminar de favoritos</button>
                    `;

                    contenedor.appendChild(div);
                }
            });
        }

        /**
         * Elimina un favorito específico ajustando el scroll levemente
         */
        function borrarUno(indice) {
            let favoritos = JSON.parse(localStorage.getItem("favoritos")) || [];
            favoritos.splice(indice, 1);
            localStorage.setItem("favoritos", JSON.stringify(favoritos));
            
            cargarFavoritos();
            
            // Ajuste de scroll suave reactivo tras la eliminación
            window.scrollBy({ top: -40, behavior: "smooth" });
        }

        /**
         * Elimina por completo la clave favoritos tras confirmación del usuario
         */
        function borrarTodos() {
            if (confirm("¿Estás seguro de que deseas eliminar todas tus frases favoritas?")) {
                localStorage.removeItem("favoritos");
                cargarFavoritos();
                
                // Desplazamiento limpio e inmediato hacia arriba
                window.scrollTo({ top: 0, behavior: "smooth" });
            }
        }

        // CONTROL DE CARGA INICIAL UNIFICADO
        window.onload = function() {
            mostrarPrimeraFrase();
            cargarFavoritos();
            window.scrollTo({ top: 0 });
        };
    </script>

</body>
</html>
