<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Álbum</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* Optimización de Scroll y Vista */
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #dfe9f7, #ffffff);
            color: #2c3e50;
            min-height: 100vh;
            /* Control de scroll y estabilidad */
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        /* NAV - Unificado, fluido y corregido para móviles */
        nav {
            background: #4da3ff;
            padding: 12px 20px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 35px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 100;
            box-sizing: border-box; /* Evita que el menú se desborde a los lados */
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05em;
            transition: 0.2s;
            white-space: nowrap; /* Evita roturas de línea incómodas */
        }

        nav a:hover {
            color: #e8f4ff;
            transform: scale(1.08);
        }

        /* HEADER */
        header {
            text-align: center;
            padding: 120px 20px 40px;
        }

        header h1 {
            font-size: 2.6em;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        header p {
            color: #4b5c6b;
            font-size: 1.1em;
        }

        /* CONTENEDOR */
        .contenedor {
            background: white;
            padding: 30px;
            margin: 20px auto 60px;
            border-radius: 20px;
            max-width: 900px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            text-align: center;
            box-sizing: border-box;
        }

        .portada {
            width: 100%;
            max-width: 850px;
            height: auto; /* Mantiene la proporción correcta de la imagen */
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .boton-album {
            display: inline-block;
            margin-top: 25px;
            padding: 16px 26px;
            background: #ff8c42;
            color: white;
            border-radius: 14px;
            font-weight: 600;
            text-decoration: none;
            font-size: 1.2em;
            transition: 0.2s;
        }

        .boton-album:hover {
            background: #ff7a1f;
            transform: scale(1.07);
        }

        /* Ajustes responsivos móviles */
        @media (max-width: 768px) {
            nav {
                justify-content: flex-start;
                gap: 20px;
                overflow-x: auto; /* Permite scroll horizontal táctil si no caben los enlaces */
                padding: 15px 10px;
            }
            
            nav a {
                font-size: 1em;
            }

            header {
                padding: 100px 15px 20px;
            }

            header h1 {
                font-size: 2.1em;
            }

            .contenedor {
                margin: 20px 15px 40px;
                padding: 20px 15px;
            }

            .boton-album {
                display: block;
                font-size: 1.1em;
                padding: 15px 20px;
                max-width: 90%;
                margin: 25px auto 0;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="musica.html">Música</a>
        <a href="anadir.html">Añadir frases</a>
        <a href="sos.html">SOS</a>
        <a href="Love.html">Favoritos</a>
        <a href="album.html">Álbum</a>
        <a href="frasesamigos.html">Frases de amigos</a>
    </nav>

    <header>
        <h1>Álbum</h1>
        <p>No podía faltar un buen álbum de fotos</p>
    </header>

    <div class="contenedor">

        <img class="portada" src="https://myalbum.com/album/HmB7E3Mc4agK7t/cover?size=1000" alt="Portada del álbum">

        <a class="boton-album" target="_blank" href="https://myalbum.com/album/HmB7E3Mc4agK7t/">
            Abrir álbum completo
        </a>

    </div>

</body>
</html>
