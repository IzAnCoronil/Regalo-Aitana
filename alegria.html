    <style>

            margin: 30px auto 60px;
            border-radius: 20px;

        }

            color: #3a3a3a;
            margin-bottom: 15px;
            font-weight: 500;

        }

            font-size: 1.05em;
            color: #7a7a7a;
            margin-bottom: 30px;
            font-style: italic;
        }

        button {
            display: inline-block;
            padding: 18px 28px;
            background: #ff8c42;
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin: 12px;
            font-size: 1.2em;
            min-width: 180px;
        }

        button:hover {
            background: #ff7a1f;
            transform: scale(1.08);
        }

        /* BOTÓN FLOTANTE GUARDAR */
        .boton-guardar {

    // -----------------------------
    // 2. CARGAR FRASES AÑADIDAS POR EL USUARIO
    // -----------------------------
    let frasesUsuario = JSON.parse(localStorage.getItem("alegria")) || [];

    // Mezclar originales + añadidas
    let frasesAlegria = frasesAlegriaOriginal.concat(frasesUsuario);

    let ultimoAutorAlegria = null;
    let primeraMostrada = false;

    // -----------------------------
    // 3. MOSTRAR PRIMERA FRASE FIJA
    // -----------------------------
    function mostrarPrimeraFrase() {
        const primera = frasesAlegriaOriginal[0];
        document.getElementById("fraseAlegria").textContent = primera.texto;
        document.getElementById("autorAlegria").textContent = "— " + primera.autor;

        frasesAlegria = frasesAlegria.slice(1);
        ultimoAutorAlegria = primera.autor;
        primeraMostrada = true;
    }

    // -----------------------------
    // 4. NUEVA FRASE ALEATORIA
    // -----------------------------
    function nuevaFraseAlegria() {
        if (!primeraMostrada) {
            mostrarPrimeraFrase();
            return;
        }

        if (frasesAlegria.length === 0) {
            document.getElementById("fraseAlegria").textContent =
                "Hoy ya no hay más frases, pero tu sonrisa puede inventar las suyas propias.";
            document.getElementById("autorAlegria").textContent = "";
            return;
        }

        let indice;
        let intentos = 0;

        do {
            indice = Math.floor(Math.random() * frasesAlegria.length);
            intentos++;
        } while (frasesAlegria[indice].autor === ultimoAutorAlegria && intentos < 10 && frasesAlegria.length > 1);

        const frase = frasesAlegria[indice];

        document.getElementById("fraseAlegria").textContent = frase.texto;
        document.getElementById("autorAlegria").textContent = "— " + frase.autor;

        ultimoAutorAlegria = frase.autor;
        frasesAlegria.splice(indice, 1);
    }

    // -----------------------------
    // 5. GUARDAR FAVORITOS
    // -----------------------------
    function guardarFavorito(idFrase, idAutor) {
        const frase = document.getElementById(idFrase).textContent;
        let autor = document.getElementById(idAutor).textContent;

        if (!frase || frase.includes("Hoy ya no hay más frases")) return;

        autor = autor.replace("— ", "");

        let favoritos = JSON.parse(localStorage.getItem("favoritos")) || [];
        const yaExiste = favoritos.some(f => f.frase === frase);
        
        if (!yaExiste) {
            favoritos.push({ frase, autor });
            localStorage.setItem("favoritos", JSON.stringify(favoritos));
            alert("¡Frase guardada en tus favoritos! ❤️");
        } else {
            alert("Esta frase ya está en tus favoritos.");
        }
    }

    window.onload = function() {
        mostrarPrimeraFrase();
    };
