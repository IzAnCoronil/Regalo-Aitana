        }

        .contenedor {

            padding: 40px;

            border-radius: 20px;

        }

        }

            padding: 18px 28px;

            font-weight: 600;
            cursor: pointer;

            font-size: 1.2em;
            min-width: 180px;
        }

        button:hover {
            background: #2575fc;
            transform: scale(1.08);
        }

        /* BOTÓN FLOTANTE GUARDAR */
        .boton-guardar {

            right: 20px;
            background: #3a86ff;
            color: white;

        // ==========================
        // NUEVA FRASE
        // ==========================
        function nuevaFraseMotivacion() {
            // Si ya no quedan frases en el mazo, muestra el mensaje personalizado pedido
            if (frasesMotivacion.length === 0) {
                document.getElementById("fraseMotivacion").textContent = "Ya no hay más frases si quieres más sólo tienes que pedirlas";
                document.getElementById("autorMotivacion").textContent = "";
                return;
            }

            let indice;
            let intentos = 0;

            do {
                indice = Math.floor(Math.random() * frasesMotivacion.length);
                intentos++;
            } while (
                frasesMotivacion[indice].autor === ultimoAutor &&
                intentos < 10 && 
                frasesMotivacion.length > 1
            );

            const frase = frasesMotivacion[indice];

            document.getElementById("fraseMotivacion").textContent = frase.texto;
            document.getElementById("autorMotivacion").textContent = "— " + frase.autor;

            ultimoAutor = frase.autor;
            frasesMotivacion.splice(indice, 1);
        }

        // ==========================
        // GUARDAR FAVORITO
        // ==========================
        function guardarFavorito(idFrase, idAutor) {
            const frase = document.getElementById(idFrase).textContent;
            let autor = document.getElementById(idAutor).textContent;

            // Filtro actualizado para que no guarde el aviso final en favoritos
            if (!frase || frase === "Ya no hay más frases si quieres más sólo tienes que pedirlas" || frase === "Añade frases para comenzar.") {
                return; 
            }

            autor = autor.replace("— ", ""); 

            let favoritos = JSON.parse(localStorage.getItem("favoritos")) || [];
            
            const yaExiste = favoritos.some(f => f.frase === frase);
            if (!yaExiste) {
                favorites.push({ frase, autor });
                localStorage.setItem("favoritos", JSON.stringify(favoritos));
                alert("¡Frase guardada en tus favoritos! ❤️");
            } else {
                alert("Esta frase ya está en tus favoritos.");
            }
        }

        // ==========================

            }

            let indiceInicial = frasesMotivacion.findIndex(f => f.autor === "IzAn" && f.texto.startsWith("Bueno, ahora tienes dudas"));
