<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Motivación</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        /* --- BARRA DE SCROLL PREMIUM PERSONALIZADA --- */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a; /* Azul pizarra oscuro profundo */
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(58, 134, 255, 0.4); /* Azul motivador translúcido */
            border-radius: 10px;
            border: 2px solid #0f172a;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(37, 117, 252, 0.8);
        }

        html {
            scrollbar-width: thin;
            scrollbar-color: rgba(58, 134, 255, 0.4) #0f172a;
            scroll-behavior: smooth;
        }

        /* --- ESTILOS DE LA ATMÓSFERA DE MOTIVACIÓN --- */
        body {
            background: radial-gradient(circle at top, #1e293b, #0f172a); /* Degradado azul oscuro sofisticado */
            color: #f8fafc;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow-y: auto;
        }

        /* NAV - Barra unificada con scroll horizontal limpio */
        nav {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 14px 20px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify(content: center;
            gap: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            z-index: 100;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            box-sizing: border-box;
        }

        nav::-webkit-scrollbar {
            display: none;
        }

        nav a {
            color: #94a3b8;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05em;
            transition: color 0.25s ease, transform 0.25s ease;
            display: inline-block;
            -webkit-tap-highlight-color: transparent;
        }

        nav a:hover {
            color: #ffffff;
            transform: scale(1.05);
        }

        header {
            text-align: center;
            padding: 140px 20px 10px;
        }

        header h1 {
            font-size: 3em;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #60a5fa, #2dd4bf); /* Azul eléctrico a cian suave, enérgico y premium */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 12px 0;
        }

        header p {
            color: #94a3b8;
            font-size: 1.15em;
            font-weight: 300;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* CONTENEDOR EFECTO VIDRIO BRILLANTE (GLASSMORPHISM) */
        .contenedor {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 50px 40px;
            margin: 40px auto 120px;
            border-radius: 24px;
            max-width: 700px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
            text-align: center;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        /* Animación fluida de aparición */
        .frase-animada {
            animation: fadeInBlur 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInBlur {
            from { opacity: 0; filter: blur(6px); transform: translateY(8px); }
            to { opacity: 1; filter: blur(0); transform: translateY(0); }
        }

        .frase {
            font-size: 1.6em;
            color: #f1f5f9;
            margin: 10px 0;
            font-weight: 400;
            line-height: 1.6;
            letter-spacing: -0.3px;
        }

        .autor {
            font-size: 1.05em;
            color: #60a5fa; /* Resalte armónico en azul claro */
            margin: 0 0 30px 0;
            font-style: italic;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        /* BOTÓN ENÉRGICO PRINCIPAL */
        .contenedor button {
            display: inline-block;
            padding: 14px 38px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1.1em;
            letter-spacing: 0.2px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            -webkit-tap-highlight-color: transparent;
        }

        .contenedor button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
        }

        .contenedor button:active {
            transform: translateY(1px);
        }

        /* BOTÓN FLOTANTE GUARDAR PREMIUM (Aislado de botones comunes) */
        button.boton-guardar {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 0;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 99;
            -webkit-tap-highlight-color: transparent;
        }

        button.boton-guardar:hover {
            background: #ffffff;
            color: #0f172a;
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(59, 130, 246, 0.4);
        }
        
        /* Ajustes Responsivos */
        @media (max-width: 768px) {
            nav {
                justify-content: flex-start;
                gap: 20px;
                padding: 14px 15px;
            }
            header {
                padding-top: 110px;
            }
            header h1 {
                font-size: 2.3em;
            }
            .contenedor {
                margin: 20px 15px 100px;
                padding: 40px 20px;
            }
            .frase {
                font-size: 1.35em;
            }
            .contenedor button {
                width: 100%;
                max-width: 320px;
            }
            button.boton-guardar {
                width: auto;
                bottom: 20px;
                right: 20px;
                padding: 10px 20px;
                font-size: 0.95em;
            }
        }
    </style>
</head>

            { texto: "La libertad es ser dueños de nuestra propia vida.", autor: "Platón" },
            { texto: "La pobreza no viene por la disminución de las riquezas, sino por la multiplicación de los deseos.", autor: "Platón" },
            { texto: "Ama y haz lo que quieras.", autor: "San Agustín" },
            { texto: "La esperanza tiene dos hijas hermosas: la indignación y el coraje.", autor: "San Agustín" },
            { texto: "Sé amable, porque toda persona que encuentras está librando una batalla difícil.", autor: "Platón" },
            { texto: "La felicidad consiste en darse cuenta de que nada es demasiado importante.", autor: "Antonio Gala" },
            { texto: "Lo más difícil es la decisión de actuar; el resto es mera tenacidad.", autor: "Amelia Earhart" },
            { texto: "El futuro empieza hoy, no mañana.", autor: "Juan Pablo II" },
            { texto: "La esperanza ve lo invisible, siente lo intangible y logra lo imposible.", autor: "Helen Keller" },
            { texto: "Las estrellas brillan más intensamente contra la noche más oscura.", autor: "Fyodor Dostoyevski" }
        ];

        let frasesUsuario = JSON.parse(localStorage.getItem("Motivacion")) || [];
        let todasLasFrases = frasesMotivacionOriginal.concat(frasesUsuario);
        
        let frasesVistas = JSON.parse(localStorage.getItem("vistas_motivacion")) || [];
        let frasesDisponibles = todasLasFrases.filter(f => !frasesVistas.includes(f.texto));
        let ultimoAutor = null;

        function aplicarAnimacion() {
            const elemento = document.getElementById("bloqueTexto");
            elemento.classList.remove("frase-animada");
            void elemento.offsetWidth; 
            elemento.classList.add("frase-animada");
        }

        function manejarFinDeFrases() {
            document.getElementById("fraseMotivacion").textContent = "Has completado todo el camino. No quedan más frases nuevas.";
            document.getElementById("autorMotivacion").textContent = "";
            
            // Buscamos el botón principal y lo deshabilitamos estéticamente
            const boton = document.querySelector(".contenedor button");
            if (boton) {
                boton.disabled = true;
                boton.style.opacity = "0.4";
                boton.style.cursor = "not-allowed";
                boton.textContent = "Fin de las frases";
            }
            aplicarAnimacion();
        }

        function nuevaFraseMotivacion() {
            if (frasesDisponibles.length === 0) {
                manejarFinDeFrases();
                return;
            }

            let indice;
            let intentos = 0;

            do {
                indice = Math.floor(Math.random() * frasesDisponibles.length);
                intentos++;
            } while (
                frasesDisponibles[indice].autor === ultimoAutor &&
                intentos < 10 && 
                frasesDisponibles.length > 1
            );

            const frase = frasesDisponibles[indice];

            document.getElementById("fraseMotivacion").textContent = frase.texto;
            document.getElementById("autorMotivacion").textContent = "— " + frase.autor;

            ultimoAutor = frase.autor;

            frasesVistas.push(frase.texto);
            localStorage.setItem("vistas_motivacion", JSON.stringify(frasesVistas));

            frasesDisponibles.splice(indice, 1);
            aplicarAnimacion();
        }

        function guardarFavorito(idFrase, idAutor) {
            const frase = document.getElementById(idFrase).textContent;
            let autor = document.getElementById(idAutor).textContent;

            if (!frase || frase.startsWith("Has completado") || frase === "Añade frases para comenzar.") {
                return; 
            }

            autor = autor.replace("— ", ""); 

            let favoritos = JSON.parse(localStorage.getItem("favoritos")) || [];
            
            const yaExiste = favoritos.some(f => f.frase === frase);
            if (!yaExiste) {
                favoritos.push({ frase, autor }); 
                localStorage.setItem("favoritos", JSON.stringify(favoritos));
                alert("¡Frase guardada en tus favoritos! ❤️");
            } else {
                alert("Esta frase ya está en tus favoritos.");
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            if (todasLasFrases.length === 0) {
                document.getElementById("fraseMotivacion").textContent = "Añade frases para comenzar.";
                return;
            }

            if (frasesDisponibles.length === 0) {
                manejarFinDeFrases();
                return;
            }

            let indiceInicial = frasesDisponibles.findIndex(f => f.autor === "IzAn" && f.texto.startsWith("Bueno, ahora tienes dudas"));

            if (indiceInicial === -1) {
                indiceInicial = Math.floor(Math.random() * frasesDisponibles.length);
            }

            const primera = frasesDisponibles[indiceInicial];

            document.getElementById("fraseMotivacion").textContent = primera.texto;
            document.getElementById("autorMotivacion").textContent = "— " + primera.autor;

            ultimoAutor = primera.autor;

            frasesVistas.push(primera.texto);
            localStorage.setItem("vistas_motivacion", JSON.stringify(frasesVistas));
            
            frasesDisponibles.splice(indiceInicial, 1);
            aplicarAnimacion();
        });
    </script>
</body>
</html>
